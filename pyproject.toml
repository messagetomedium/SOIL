[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-soil"
version = "0.1.0"
description = "The First Seed: autonomous growth of executable sound tissue"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "sounddevice>=0.5,<0.6", "PySide6>=6.7,<7", "pyqtgraph>=0.13,<0.15"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
soil-observer = "observer.main:main"

[tool.setuptools.packages.find]
include = ["observer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
